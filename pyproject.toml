[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emerald-tournament"
version = "0.1.0"
requires-python = ">=3.10"
description = "Source-audited Pokémon Emerald trainer tournament research"

[project.scripts]
emerald-tournament = "emerald_tournament.__main__:main"
emerald-tournament-parallel = "emerald_tournament.parallel_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
